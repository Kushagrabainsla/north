<!doctype html>
<meta charset="utf-8" />
<title>TaskWindow</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    padding: 24px;
    font: 13px/1.55 system-ui, -apple-system, sans-serif;
    text-align: center;
    color: #3c4043;
    background: #fff;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  p { margin: 0; max-width: 30rem; color: #5f6368; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8eaed; background: #202124; }
    p { color: #9aa0a6; }
  }
</style>

<h1>TaskWindow workspace</h1>
<p>
  Coding agents open their tabs in this window, each task in its own blue tab
  group. This pinned tab keeps the window open when a task finishes, so the
  window stays where you put it.
</p>
<p>Closing it is fine — it only means the next task opens a fresh window.</p>
