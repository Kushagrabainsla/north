agent: reviewer
domain: engineering
model_pool: reasoning
# The reviewer must be a genuine second opinion, so the orchestrator runs it on a
# different model than the coder used for this task (Copilot /subagents style).
distinct_from:
  - coder
accepts:
  - "code review"
  - "review the code"
  - "test"
  - "verify"
  - "validate"
  - "qa"
  - "check the code"
  - "audit"
  - "diff"
produces:
  - "{handoff_dir}/qa/review_report_latest.md"
  - "{handoff_dir}/qa/review_report_vN.md"
output_format: structured_json
version: 2.0.0
class_name: ReviewerAgent
