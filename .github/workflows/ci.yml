name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Cancel an in-progress run on the same ref when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Lint
        run: ruff check .

  types:
    # Ruff and pytest both passed on a tree where a `str` was passed where a
    # ModelCapability was annotated, which crashed every task at the planner.
    # mypy catches that class of bug. Scoped to the packages that are already
    # clean; widen the list as each remaining package is cleared.
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e . mypy

      - name: Type check
        run: mypy --ignore-missing-imports --follow-imports=silent inference/ architecture/

  web:
    # The browser interface had no CI at all: a type error or a broken unit test
    # in web/src reached main as long as Python was green. `npm run build` runs
    # `tsc -b` first, so this covers the types as well as the bundle.
    name: Web (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (type check + bundle)
        run: npm run build
        working-directory: web

      - name: Test
        run: npm test
        working-directory: web

  architecture:
    # The boundary rules are only real if they block a merge. These run in the
    # main pytest job too, but as a dedicated gate they fail fast and name the
    # reason: a new forbidden import, an unowned file, a widened edit scope, or a
    # packaging change that would drop a shipped package.
    name: Architecture (boundaries + packaging)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e . pytest pytest-asyncio

      - name: Enforce module contracts, import direction, edit scopes and packaging
        env:
          NORTH_HOME: /tmp/north-ci-architecture
          NORTH_ENV: test
        run: python -m pytest tests/unit/architecture -q

  package:
    name: Package (source distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Reject development content from the source distribution
        run: |
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          python - "$sdist" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          forbidden_roots = {"architecture", "docs", "evals", "experiments", "scripts", "tests"}
          with tarfile.open(sys.argv[1]) as archive:
              for name in archive.getnames():
                  parts = PurePosixPath(name).parts[1:]  # strip the sdist's generated root
                  assert not parts or parts[0] not in forbidden_roots, name
                  assert parts[:2] != ("web", "src"), name
                  assert parts not in {("web", "index.html"), ("web", "vite.config.js")}, name
          PY

      - name: Reject development content from the wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python - "$wheel" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          forbidden_roots = {"architecture", "docs", "evals", "experiments", "scripts", "tests"}
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for name in archive.namelist():
                  parts = PurePosixPath(name).parts
                  assert not parts or parts[0] not in forbidden_roots, name
                  assert parts[:2] != ("web", "src"), name
                  assert parts != ("README.md",), name
          PY

      - name: Install wheel and smoke-test runtime resources
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv pip install --system "$wheel"
          repo_root="$(pwd)"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          NORTH_REPO_ROOT="$repo_root" python - <<'PY'
          import os
          from pathlib import Path

          import cli
          from cli.main import app
          from orchestrator.app import app as server_app
          from utils.prompts import load_prompt
          from utils.runtime_resources import builtin_skills_dir, policies_dir, web_dist_dir

          repo_root = Path(os.environ["NORTH_REPO_ROOT"]).resolve()
          assert not Path(cli.__file__).resolve().is_relative_to(repo_root)
          assert app is not None and server_app is not None
          assert "planner" in load_prompt("prompts/planner.md").lower()
          assert builtin_skills_dir().is_dir()
          assert policies_dir().is_dir()
          assert web_dist_dir().is_dir()
          PY

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e . pytest pytest-asyncio

      - name: Run tests
        env:
          NORTH_HOME: /tmp/north-ci
          NORTH_ENV: test
          NORTH_OPENROUTER_API_KEY: ci-dummy-key
        run: python -m pytest -x -q --tb=short -m "not integration"
