name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Cancel an in-progress run on the same ref when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Lint
        run: ruff check .

  types:
    # Ruff and pytest both passed on a tree where a `str` was passed where a
    # ModelCapability was annotated, which crashed every task at the planner.
    # mypy catches that class of bug. Scoped to the packages that are already
    # clean; widen the list as each remaining package is cleared.
    name: Types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e . mypy

      - name: Type check
        run: mypy --ignore-missing-imports --follow-imports=silent inference/

  web:
    # The browser interface had no CI at all: a type error or a broken unit test
    # in web/src reached main as long as Python was green. `npm run build` runs
    # `tsc -b` first, so this covers the types as well as the bundle.
    name: Web (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (type check + bundle)
        run: npm run build
        working-directory: web

      - name: Test
        run: npm test
        working-directory: web

  package:
    name: Package (source distribution)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Reject vendored frontend dependencies from the source distribution
        run: |
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          ! tar -tzf "$sdist" | grep -q '/web/node_modules/'

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e . pytest pytest-asyncio

      - name: Run tests
        env:
          NORTH_HOME: /tmp/north-ci
          NORTH_ENV: test
          NORTH_OPENROUTER_API_KEY: ci-dummy-key
        run: python -m pytest -x -q --tb=short -m "not integration"
